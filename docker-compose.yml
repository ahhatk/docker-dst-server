services:
  dst-server:
    build: .
    image: dst-server:local
    restart: "on-failure:5"
    ports:
      - "10999-11000:10999-11000/udp"
      - "12346-12347:12346-12347/udp"
    environment:
      - DST_SERVER_ARCH=amd64
    env_file:
      - .env.local
    volumes:
      - ~/.klei/DoNotStarveTogether:/data
    stop_grace_period: 6m
